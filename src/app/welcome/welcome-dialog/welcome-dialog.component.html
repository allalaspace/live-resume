<div class="dialog-container">
    <img loading="lazy" src="assets/template/welcome/bubble-frame.png" alt="Welcome Speech Bobble"/>
    <div class="console">
        <p class="hello" i18n="dialog@@hello">Salut!</p>
        <span
            class="txt-rotate" 
            typingAnimation
            [phrasePeriod]="2000"
            [startDelay]="1500"
            [typeSpeed]="200"
            [data]="[
                
                { 
                    'language': 'en',
                    'phrases': [ 'My name is Mohamed Ali Boudiche.', 'Data and application engineer.', 'Welcome to my portfolio.' ]
                },
                { 
                    'language': 'fr',
                    'phrases': [ 'Je me nomme Mohamed Ali Boudiche.', 'Ingénieur data et applicatif.', 'Bienvenue sur mon portfolio.' ]
                }
            ]"></span>
    </div>
</div>
