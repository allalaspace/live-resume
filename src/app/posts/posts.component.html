<section id="posts">
    <div class="container">
        <div class="top-container">
            <div class="title">
                <h1 i18n="nav@@posts">Posts</h1>
            </div>
        </div>
        <p class="synopsis" i18n="posts@@synopsis">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec vulputate sagittis velit, eget scelerisque arcu semper finibus.</p>
        <p class="empty" *ngIf="loaded && !posts.length" i18n="posts@@empty">No articles yet.</p>
        <ol class="grid" *ngIf="posts.length">
            <li *ngFor="let post of posts">
                <a *ngIf="post.markdownFile && post.id; else externalLink" [routerLink]="['/posts', post.id]" class="card">
                    <ng-container *ngTemplateOutlet="cardBody; context: { post: post }"></ng-container>
                </a>
                <ng-template #externalLink>
                    <a *ngIf="post.http; else plainCard" href="{{ post.http }}" rel="nofollow" target="_blank" class="card">
                        <ng-container *ngTemplateOutlet="cardBody; context: { post: post }"></ng-container>
                    </a>
                    <ng-template #plainCard>
                        <div class="card">
                            <ng-container *ngTemplateOutlet="cardBody; context: { post: post }"></ng-container>
                        </div>
                    </ng-template>
                </ng-template>
            </li>
        </ol>
        <ng-template #cardBody let-post="post">
            <div class="thumbnail" [style.backgroundImage]="post.thumbnail ? 'url('+post.thumbnail+')' : null">
                <span class="date">{{ post.date | safariDateFormatter | localizedDate:'MMM yyyy' }}</span>
            </div>
            <div class="content">
                <h2 class="title" internationalization [data]="post.internationalizations" property='title'>Loading...</h2>
                <p class="description" internationalization [data]="post.internationalizations" property='description'>Loading...</p>
            </div>
        </ng-template>
    </div>
</section>
