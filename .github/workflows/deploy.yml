name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install --force

      - name: Create environment file
        run: |
          mkdir -p src/environments
          cat > src/environments/environment.ts << 'EOF'
          export const environment = {
            production: true,
            supabaseUrl: "https://rrrvkpwmwijhbjbugqrz.supabase.co",
            supabaseKey: "sb_publishable_c4R8W5DvJX2j2I8LMnQsTg_p8ddShed"
          };
          EOF

      - name: Build
        run: |
          npm install -g @angular/cli
          ng build --configuration=fr --base-href="https://allalaspace.github.io/live-resume/"
          cp dist/live-resume/fr/index.html dist/live-resume/fr/404.html

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@4.1.5
        with:
          branch: gh-pages
          folder: dist/live-resume/fr
          clean: true
