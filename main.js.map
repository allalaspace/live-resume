<section id="experience" class="landscape" [style.backgroundImage]="'url('+backgroundUrl+')'">
    <div class="overlay">
        <div class="container">
            <div class="top-container">
                <div class="title">
                    <h1 i18n="nav@@experiences">Experiences</h1>
                </div>
            </div>

            <div class="middle-container">
                <ol class="timeline">
                    <li *ngFor="let exp of experiencesOrdered" class="card">
                        <div class="header-block">
                            <div class="logo-block" *ngIf="exp.logo">
                                <a *ngIf="exp.website; else plainLogo" href="{{ exp.website }}" target="_blank" rel="noopener noreferrer"><img src="{{ exp.logo }}" alt="{{ exp.companyName }}"></a>
                                <ng-template #plainLogo>
                                    <img src="{{ exp.logo }}" alt="{{ exp.companyName }}">
                                </ng-template>
                            </div>
                            <div class="info-block">
                                <div class="company-name">
                                    <a *ngIf="exp.website; else plainName" href="{{ exp.website }}" target="_blank" rel="noopener noreferrer">{{ exp.companyName }}</a>
                                    <ng-template #plainName><span>{{ exp.companyName }}</span></ng-template>
                                </div>
                                <div class="role" internationalization [data]="exp.internationalizations" property='role'>Loading...</div>
                                <div class="period">
                                    <span>{{ exp.startAt | safariDateFormatter | localizedDate:'MMM yyyy' }}</span>
                                    <span class="devider">-</span>
                                    <span>{{ (exp.endAt | safariDateFormatter | localizedDate:'MMM yyyy') }}</span>
                                </div>
                                <div class="location">
                                    <span class="city" internationalization [data]="exp.internationalizations" property='city'>Loading...</span>
                                    <span class="devider" *ngIf="hasCityAndCountry(exp)">,&nbsp;</span>
                                    <span class="country" internationalization [data]="exp.internationalizations" property='country'></span>
                                </div>
                            </div>
                        </div>
                        <div class="description" [class.clamped]="!isExpanded(exp.id)" internationalization [data]="exp.internationalizations" property='description'>Loading...</div>
                        <div class="technologies">
                            <span class="hashtag" *ngFor="let technology of exp.technologies">{{ technology }}</span>
                        </div>
                        <button type="button" class="toggle" (click)="toggle(exp.id)" [attr.aria-expanded]="isExpanded(exp.id)">
                            <span *ngIf="!isExpanded(exp.id)" i18n="posts@@readMore">Read more</span>
                            <span *ngIf="isExpanded(exp.id)" i18n="experience@@showLess">Show less</span>
                        </button>
                    </li>
                </ol>
            </div>
        </div>
    </div>
</section>
